<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MARCHIO — il mondo di ARGOMENTO</title>
  <meta name="description" content="Scorri per volare nel mondo di MARCHIO." />
  <style>
    /* Il tema del motore si imposta qui. Questi valori riprendono lo sfondo e la palette delle scene generate. */
    :root, .sw-root {
      --sw-bg: #F5EDE0;          /* == il colore di sfondo delle scene */
      --sw-ink: #241d2b;
      --sw-ink-soft: #6a6072;
      --sw-accent: #9B7EBD;      /* gli accent delle singole sezioni lo sostituiscono a runtime */
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world">
    <!-- Testi statici per la SEO: l'UNICO testo indicizzabile della pagina (il motore
         disegna i suoi testi lato client). Riporta qui i testi veri delle sezioni: h1 =
         frase dell'hero, un h2 + p per scena, link veri per la CTA. Il motore nasconde
         questo blocco al montaggio. -->
    <section data-sw-seo>
      <h1>La frase dell'hero.</h1>
      <p>Una frase che presenta MARCHIO: cos'è il mondo e perché conta.</p>
      <h2>Etichetta di valore — titolo della scena A</h2>
      <p>La frase della scena A.</p>
      <!-- …un h2 + p per scena… -->
      <h2>E tutto confluisce in — una sola cosa perfetta.</h2>
      <p>La frase di chiusura.</p>
      <p><a href="#">Inizia</a> · <a href="#">Scopri di più</a></p>
    </section>
  </div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'MARCHIO', href: '#top' },
      cta: { label: 'Ordina ora', href: '#finale' },
      hint: 'scorri per entrare in volo',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        // Un oggetto per scena, in ordine. `accent` colora testi e percorso di quella scena.
        // La prima sezione è l'hero (i suoi testi accolgono all'arrivo); l'ultima porta la CTA.
        {
          id: 'sceneA', label: 'Scena A',
          still: 'assets/sceneA.webp',
          poster: 'assets/sceneA-poster.webp',     // primo frame estratto dalla clip codificata (pipeline §5b)
          clip: 'assets/vid/sceneA.mp4',
          clipMobile: 'assets/vid/sceneA-m.mp4',       // solo fasce mobile: codifica 720p -g 4, servita agli schermi da telefono
          posterMobile: 'assets/sceneA-poster-m.webp', // primo frame estratto dalla codifica mobile (pipeline §6)
          accent: '#8FB98A',
          // scroll: 1.6, linger: 0.45,  // ritmo facoltativo: sosta più lunga; la camera si assesta a metà scena
          eyebrow: 'Etichetta di valore',
          title: 'La frase dell\'hero.',
          body: 'Una frase semplice su questa fase.',
          tags: ['Prova', 'Prova', 'Prova'],
        },
        // …scene intermedie…
        {
          id: 'finale', label: 'Il prodotto',
          still: 'assets/product.webp',
          poster: 'assets/finale-poster.webp',
          clip: 'assets/vid/finale.mp4',
          clipMobile: 'assets/vid/finale-m.mp4',
          posterMobile: 'assets/finale-poster-m.webp',
          accent: '#9B7EBD',
          eyebrow: 'E tutto confluisce in',
          title: 'Una sola cosa perfetta.',
          body: 'La frase di chiusura.',
          tags: [],
          cta: { primary: { label: 'Inizia', href: '#' },
                 secondary: { label: 'Scopri di più', href: '#' } },
        },
      ],
      // lunghezza === sections.length - 1, in ordine. Generati come al passo 5 di SKILL.md.
      connectors: [
        'assets/vid/conn1.mp4',
        // 'assets/vid/conn2.mp4', …
      ],
      // Solo con le codifiche mobile: connettori più leggeri per i telefoni, stessa lunghezza e ordine di `connectors`.
      connectorsMobile: [
        'assets/vid/conn1-m.mp4',
        // 'assets/vid/conn2-m.mp4', …
      ],
    });
  </script>
</body>
</html>
