name: Validate Kit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: pip install pyyaml

      - name: Validate CLI help
        run: node bin/install.js help

      - name: Validate kit (frontmatter, references, counts, scripts, installer)
        run: python .github/scripts/validate_kit.py

      - name: Lint Markdown (rules in .markdownlint.jsonc)
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
