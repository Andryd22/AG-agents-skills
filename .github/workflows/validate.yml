name: Validate Kit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v7

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configura Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installa le dipendenze del validatore
        run: pip install pyyaml

      - name: Controlla l'aiuto della CLI
        run: node bin/install.js help

      - name: Test di regressione (installer e controlli)
        run: python -m unittest discover -s tests -v

      - name: Controlla il kit (frontmatter, riferimenti, conteggi, script, installer)
        run: python .github/scripts/validate_kit.py

      - name: Lint del Markdown (regole in .markdownlint.jsonc)
        if: runner.os == 'Linux'
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
